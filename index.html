<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>repocraft</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #faf6ec;
  --bg-soft: #f4efe2;
  --paper: #fbf7ee;
  --ink: #1c1812;
  --ink-soft: #5a5043;
  --ink-faint: #9a8e7d;
  --rule: #e6dec8;
  --accent: #8a3a1f;
  --accent-light: #f5ede8;
  --danger: #b03020;
  --danger-light: #fdf0ec;
  --font: Verdana, Geneva, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); font-size: 14px; background: var(--bg); color: var(--ink); }

.shell { display: flex; flex-direction: column; height: 100vh; }

/* ── Top bar ── */
.topbar {
  height: 46px; flex-shrink: 0;
  display: flex; align-items: center; gap: 14px;
  padding: 0 20px;
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.brand { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; }
.brand-dot { color: var(--accent); }
.topbar-path { font-size: 12px; color: var(--ink-faint); font-style: italic; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-path a { color: var(--ink-faint); text-decoration: none; }
.topbar-path a:hover { color: var(--accent); }
.site-link {
  font-size: 12px; color: var(--ink-faint); text-decoration: none;
  padding: 4px 10px; border: 1px solid var(--rule); border-radius: 4px;
  transition: all 150ms;
}
.site-link:hover { color: var(--accent); border-color: var(--accent); }
.save-btn {
  padding: 5px 14px; border-radius: 4px; font-size: 12px; font-family: var(--font);
  cursor: pointer; border: 1px solid var(--rule); background: transparent;
  color: var(--ink-faint); transition: all 150ms ease; white-space: nowrap;
}
.save-btn.dirty { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.save-btn:disabled { cursor: default; opacity: 0.7; }

/* ── Layout ── */
.body { display: flex; flex: 1; overflow: hidden; }
.sidebar {
  width: 152px; flex-shrink: 0;
  border-right: 1px solid var(--rule);
  background: var(--bg-soft);
  padding: 10px 0; overflow-y: auto;
}
.nav-item {
  display: flex; align-items: center; width: 100%;
  padding: 8px 16px; gap: 8px;
  background: none; border: none; font-family: var(--font); font-size: 13px;
  color: var(--ink-soft); cursor: pointer; text-align: left;
  transition: color 100ms, background 100ms;
}
.nav-item:hover { background: var(--rule); color: var(--ink); }
.nav-item.active { color: var(--accent); font-weight: 700; background: var(--accent-light); }
.badge { font-size: 10px; background: var(--rule); color: var(--ink-faint); border-radius: 10px; padding: 1px 6px; margin-left: auto; }
.nav-item.active .badge { background: #e0c0b8; color: var(--accent); }

.main { flex: 1; overflow: hidden; display: flex; }

/* ── List + Detail ── */
.list-detail { display: flex; width: 100%; overflow: hidden; }
.list-pane {
  width: 230px; flex-shrink: 0;
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; overflow: hidden;
}
.list-pane-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--rule);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.list-pane-head h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); }
.add-btn {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 18px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.list-scroll { flex: 1; overflow-y: auto; }
.list-item {
  padding: 10px 16px; cursor: pointer; font-size: 13px;
  border-bottom: 1px solid var(--rule);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--ink-soft); transition: background 80ms;
}
.list-item:hover { background: var(--bg-soft); color: var(--ink); }
.list-item.sel { background: var(--accent-light); color: var(--accent); font-weight: 600; border-left: 2px solid var(--accent); padding-left: 14px; }
.list-empty {
  padding: 28px 16px; color: var(--ink-faint); font-style: italic; font-size: 13px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
}
.list-empty-hint { font-size: 11px; color: var(--ink-faint); opacity: 0.7; }

.detail-pane { flex: 1; padding: 22px 26px; overflow-y: auto; }
.simple-pane { flex: 1; padding: 22px 26px; overflow-y: auto; max-width: 580px; }
.detail-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex: 1; gap: 8px; color: var(--ink-faint);
}
.detail-empty p { font-style: italic; font-size: 14px; }
.detail-empty span { font-size: 12px; opacity: 0.65; }

/* ── Section header ── */
.sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.sec-head h2 { font-size: 16px; font-weight: 700; }
.sec-head-actions { display: flex; gap: 6px; align-items: center; }

/* ── Form ── */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); margin-bottom: 5px; font-weight: 600; }
.field input, .field textarea {
  width: 100%; font-family: var(--font); font-size: 13px;
  padding: 7px 10px; border: 1px solid var(--rule); border-radius: 4px;
  background: var(--paper); color: var(--ink); outline: none;
  transition: border-color 150ms;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
.field textarea { resize: vertical; min-height: 70px; line-height: 1.55; }
.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; }
.field-hint { font-size: 10px; color: var(--ink-faint); margin-top: 4px; font-style: italic; }

/* ── Buttons ── */
.del-btn { padding: 4px 10px; border: 1px solid #ddb0a0; border-radius: 4px; color: var(--danger); background: transparent; cursor: pointer; font-family: var(--font); font-size: 12px; }
.del-btn:hover { background: var(--danger-light); }
.move-btn { width: 22px; height: 22px; border: 1px solid var(--rule); border-radius: 3px; background: transparent; cursor: pointer; color: var(--ink-faint); font-size: 12px; display: flex; align-items: center; justify-content: center; }
.move-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
.text-btn { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; font-family: var(--font); text-decoration: underline; text-underline-offset: 2px; padding: 0; }
.text-btn:hover { color: #6a2810; }
.icon-btn { width: 22px; height: 22px; border: 1px solid var(--rule); border-radius: 3px; background: transparent; cursor: pointer; color: var(--ink-faint); font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-btn:hover { color: var(--danger); border-color: var(--danger); }
.preview-btn {
  padding: 4px 10px; border: 1px solid var(--rule); border-radius: 4px;
  background: transparent; cursor: pointer; font-family: var(--font); font-size: 12px;
  color: var(--ink-faint); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  transition: all 150ms;
}
.preview-btn:hover { color: var(--accent); border-color: var(--accent); }

/* ── Body (paragraphs) editor ── */
.para-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
.para-item textarea { flex: 1; min-height: 60px; }
.word-count { font-size: 10px; color: var(--ink-faint); margin-top: 6px; font-style: italic; }

/* ── Book rows ── */
.book-row { display: flex; gap: 7px; align-items: center; margin-bottom: 6px; }
.book-row input { font-family: var(--font); font-size: 12px; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); outline: none; }
.book-row input:focus { border-color: var(--accent); }
.book-row .title { flex: 2; }
.book-row .author { flex: 1.2; }
.book-row .note { flex: 0 0 100px; }
.book-col-head { display: flex; gap: 7px; margin-bottom: 4px; padding-right: 30px; }
.book-col-head span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); font-weight: 600; }
.book-col-head .t { flex: 2; }
.book-col-head .a { flex: 1.2; }
.book-col-head .n { flex: 0 0 100px; }

/* ── Contact rows ── */
.contact-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.contact-row input { font-family: var(--font); font-size: 12px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); outline: none; }
.contact-row input:focus { border-color: var(--accent); }
.contact-row .label { flex: 0 0 90px; }
.contact-row .value { flex: 1.2; }
.contact-row .href { flex: 1.5; }
.contact-header { display: flex; gap: 8px; margin-bottom: 6px; padding: 0 28px 0 0; }
.contact-header span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); font-weight: 600; }
.contact-header .l { flex: 0 0 90px; }
.contact-header .v { flex: 1.2; }
.contact-header .h { flex: 1.5; }

/* ── Commit modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(28, 24, 18, 0.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  animation: fadein 120ms ease;
}
.modal {
  background: var(--paper); border: 1px solid var(--rule); border-radius: 8px;
  padding: 22px 24px; width: 400px;
  box-shadow: 0 12px 48px rgba(28, 24, 18, 0.22);
}
.modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.modal p { font-size: 12px; color: var(--ink-faint); margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.btn-cancel {
  padding: 6px 14px; border: 1px solid var(--rule); border-radius: 4px;
  background: transparent; cursor: pointer; font-family: var(--font); font-size: 13px; color: var(--ink-soft);
}
.btn-cancel:hover { border-color: var(--ink-soft); }
.btn-commit {
  padding: 6px 16px; background: var(--accent); color: #fff; border: none;
  border-radius: 4px; cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: 600;
}
.btn-commit:disabled { opacity: 0.6; cursor: default; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  padding: 9px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,0.18); z-index: 999;
  animation: slideUp 200ms ease;
}
.toast.ok { background: #27522a; color: #fff; }
.toast.err { background: var(--danger); color: #fff; }
@keyframes slideUp { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes fadein  { from { opacity: 0; } to { opacity: 1; } }

.loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--ink-faint); font-style: italic; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── Utilities ──────────────────────────────────────────────── */

function toSlug(s) {
  return s.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '') // strip accents
    .replace(/[^a-z0-9\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-');
}

function toDateLabel(dateStr) {
  if (!dateStr || dateStr.length < 7) return '';
  const d = new Date(dateStr + 'T12:00:00');
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}

function wordCount(paragraphs) {
  const total = (paragraphs || []).join(' ').trim().split(/\s+/).filter(Boolean).length;
  const mins = Math.max(1, Math.round(total / 200));
  return `${total} words · ~${mins} min read`;
}

/* ─── Shared components ──────────────────────────────────────── */

function Field({ label, value, onChange, type = 'input', rows = 3, placeholder = '', hint = '' }) {
  return (
    <div className="field">
      <label>{label}</label>
      {type === 'textarea'
        ? <textarea value={value} onChange={e => onChange(e.target.value)} rows={rows} placeholder={placeholder} />
        : <input type="text" value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} />
      }
      {hint && <div className="field-hint">{hint}</div>}
    </div>
  );
}

function BodyEditor({ paragraphs, onChange }) {
  const update = (i, v) => { const n = [...paragraphs]; n[i] = v; onChange(n); };
  const remove = (i) => onChange(paragraphs.filter((_, j) => j !== i));
  return (
    <div className="field">
      <label>Body</label>
      {paragraphs.map((p, i) => (
        <div className="para-item" key={i}>
          <textarea value={p} onChange={e => update(i, e.target.value)} rows={3} placeholder={`Paragraph ${i + 1}`} />
          <button className="icon-btn" onClick={() => remove(i)} title="Remove paragraph">×</button>
        </div>
      ))}
      <button className="text-btn" onClick={() => onChange([...paragraphs, ''])}>+ Add paragraph</button>
      <div className="word-count">{wordCount(paragraphs)}</div>
    </div>
  );
}

function ListDetail({ items, getLabel, sel, onSel, onAdd, sectionTitle, emptyMsg, children }) {
  return (
    <div className="list-detail">
      <div className="list-pane">
        <div className="list-pane-head">
          <h2>{sectionTitle}</h2>
          <button className="add-btn" onClick={onAdd} title={`Add ${sectionTitle.toLowerCase()}`}>+</button>
        </div>
        <div className="list-scroll">
          {items.length === 0
            ? <div className="list-empty">
                <span>{emptyMsg || 'Nothing here yet'}</span>
                <span className="list-empty-hint">Click + to add one</span>
              </div>
            : items.map((item, i) => (
              <div key={i} className={`list-item ${sel === i ? 'sel' : ''}`} onClick={() => onSel(i)}>
                {getLabel(item, i)}
              </div>
            ))
          }
        </div>
      </div>
      {sel === null || sel >= items.length
        ? <div className="detail-empty">
            <p>Select an item to edit</p>
            {items.length > 0 && <span>or click + to add a new one</span>}
          </div>
        : <div className="detail-pane">{children}</div>
      }
    </div>
  );
}

function MoveButtons({ onUp, onDown }) {
  return (
    <>
      <button className="move-btn" onClick={onUp} title="Move up">↑</button>
      <button className="move-btn" onClick={onDown} title="Move down">↓</button>
    </>
  );
}

function useListEditor(data, onChange) {
  const [sel, setSel] = useState(0);
  useEffect(() => {
    if (sel >= data.length) setSel(Math.max(0, data.length - 1));
  }, [data.length]);

  const update = (i, changes) => {
    const n = [...data]; n[i] = { ...n[i], ...changes }; onChange(n);
  };
  const del = (i, label) => {
    if (!window.confirm(`Delete "${label}"? This cannot be undone.`)) return;
    onChange(data.filter((_, j) => j !== i));
    setSel(s => Math.min(s, data.length - 2));
  };
  const move = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= data.length) return;
    const n = [...data]; [n[i], n[j]] = [n[j], n[i]]; onChange(n); setSel(j);
  };
  return { sel, setSel, update, del, move };
}

/* ─── Commit modal ───────────────────────────────────────────── */

function CommitModal({ onCommit, onCancel, saving }) {
  const [msg, setMsg] = useState('');
  const ref = useRef(null);
  useEffect(() => { ref.current?.focus(); }, []);
  const submit = () => onCommit(msg.trim() || 'update content');
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onCancel()}>
      <div className="modal">
        <h3>Commit to GitHub</h3>
        <p>Describe what you changed — shows up in your repo history.</p>
        <Field
          label="Commit message"
          value={msg}
          onChange={setMsg}
          placeholder="add essay · update bio · add book"
        />
        <div className="modal-actions">
          <button className="btn-cancel" onClick={onCancel}>Cancel</button>
          <button className="btn-commit" onClick={submit} disabled={saving}>
            {saving ? 'Committing…' : 'Commit →'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─── Section editors ────────────────────────────────────────── */

function SiteEditor({ data, onChange }) {
  const set = (k, v) => onChange({ ...data, [k]: v });
  return (
    <div className="simple-pane">
      <div className="sec-head"><h2>Site settings</h2></div>
      <Field label="Name" value={data.name} onChange={v => set('name', v)} />
      <Field label="Tagline" value={data.tag} onChange={v => set('tag', v)} type="textarea" rows={2} />
      <Field label="Domain" value={data.domain} onChange={v => set('domain', v)} />
      <Field label="Email" value={data.email} onChange={v => set('email', v)} />
    </div>
  );
}

function WritingsEditor({ data, onChange, domain }) {
  const { sel, setSel, update, del, move } = useListEditor(data, onChange);
  // Track whether slug was manually edited for the current item
  const slugManual = useRef(false);
  const prevSel = useRef(sel);
  useEffect(() => { if (sel !== prevSel.current) { slugManual.current = false; prevSel.current = sel; } }, [sel]);

  const add = () => {
    const today = new Date().toISOString().slice(0, 10);
    const e = {
      slug: 'new-writing',
      title: 'New Writing',
      date: today,
      dateLabel: toDateLabel(today),
      readTime: '5 min',
      excerpt: '',
      body: [''],
    };
    onChange([e, ...data]); setSel(0); slugManual.current = false;
  };

  const handleTitleChange = (v) => {
    const changes = { title: v };
    if (!slugManual.current) changes.slug = toSlug(v) || 'untitled';
    update(sel, changes);
  };

  const handleSlugChange = (v) => {
    slugManual.current = true;
    update(sel, { slug: v });
  };

  const handleDateChange = (v) => {
    const changes = { date: v };
    const label = toDateLabel(v);
    if (label) changes.dateLabel = label;
    update(sel, changes);
  };

  const essay = data[sel];
  const previewUrl = essay && domain ? `https://${domain}/#/writing/${essay.slug}` : null;

  return (
    <ListDetail
      items={data}
      getLabel={e => e.title || 'Untitled'}
      sel={sel} onSel={setSel} onAdd={add}
      sectionTitle="Writings"
      emptyMsg="No writings yet"
    >
      {essay && (
        <>
          <div className="sec-head">
            <h2 style={{ maxWidth: 300, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {essay.title || 'Untitled'}
            </h2>
            <div className="sec-head-actions">
              {previewUrl && (
                <a className="preview-btn" href={previewUrl} target="_blank" rel="noreferrer">
                  ↗ Preview
                </a>
              )}
              <MoveButtons onUp={() => move(sel, -1)} onDown={() => move(sel, 1)} />
              <button className="del-btn" onClick={() => del(sel, essay.title)}>Delete</button>
            </div>
          </div>
          <Field label="Title" value={essay.title} onChange={handleTitleChange} />
          <Field
            label="Slug"
            value={essay.slug}
            onChange={handleSlugChange}
            placeholder="my-writing-slug"
            hint={!slugManual.current ? 'Auto-generated from title — edit to override' : ''}
          />
          <div className="field-row">
            <Field label="Date (YYYY-MM-DD)" value={essay.date} onChange={handleDateChange} />
            <Field label="Display date" value={essay.dateLabel} onChange={v => update(sel, { dateLabel: v })} hint="Auto-filled from date" />
            <Field label="Read time" value={essay.readTime} onChange={v => update(sel, { readTime: v })} placeholder="5 min" />
          </div>
          <Field label="Excerpt" value={essay.excerpt} onChange={v => update(sel, { excerpt: v })} type="textarea" rows={2} placeholder="Short summary shown on hover" />
          <BodyEditor paragraphs={essay.body} onChange={v => update(sel, { body: v })} />
        </>
      )}
    </ListDetail>
  );
}

function ProjectsEditor({ data, onChange }) {
  const { sel, setSel, update, del, move } = useListEditor(data, onChange);
  const add = () => {
    const p = { name: 'new-project', year: String(new Date().getFullYear()), desc: '', href: '#', tags: '' };
    onChange([p, ...data]); setSel(0);
  };
  const proj = data[sel];
  return (
    <ListDetail items={data} getLabel={p => p.name} sel={sel} onSel={setSel} onAdd={add} sectionTitle="Projects" emptyMsg="No projects yet">
      {proj && (
        <>
          <div className="sec-head">
            <h2>{proj.name}</h2>
            <div className="sec-head-actions">
              <MoveButtons onUp={() => move(sel, -1)} onDown={() => move(sel, 1)} />
              <button className="del-btn" onClick={() => del(sel, proj.name)}>Delete</button>
            </div>
          </div>
          <div className="field-row">
            <Field label="Name" value={proj.name} onChange={v => update(sel, { name: v })} />
            <Field label="Year" value={proj.year} onChange={v => update(sel, { year: v })} />
          </div>
          <Field label="Description" value={proj.desc} onChange={v => update(sel, { desc: v })} type="textarea" rows={3} />
          <div className="field-row">
            <Field label="Link (href)" value={proj.href} onChange={v => update(sel, { href: v })} placeholder="https://..." />
            <Field label="Tags" value={proj.tags} onChange={v => update(sel, { tags: v })} placeholder="open source · typescript" />
          </div>
        </>
      )}
    </ListDetail>
  );
}

function WorkEditor({ data, onChange }) {
  const work = data.work || [];
  const { sel, setSel, update, del, move } = useListEditor(work, v => onChange({ ...data, work: v }));
  const add = () => {
    const item = { role: 'New Role', where: '', when: '', desc: '' };
    onChange({ ...data, work: [item, ...work] }); setSel(0);
  };
  const item = work[sel];
  return (
    <ListDetail items={work} getLabel={e => `${e.role}${e.where ? ', ' + e.where : ''}`} sel={sel} onSel={setSel} onAdd={add} sectionTitle="Work" emptyMsg="No work experience yet">
      {item && (
        <>
          <div className="sec-head">
            <h2>{item.role}</h2>
            <div className="sec-head-actions">
              <MoveButtons onUp={() => move(sel, -1)} onDown={() => move(sel, 1)} />
              <button className="del-btn" onClick={() => del(sel, item.role)}>Delete</button>
            </div>
          </div>
          <Field label="Role" value={item.role} onChange={v => update(sel, { role: v })} />
          <div className="field-row">
            <Field label="Where" value={item.where} onChange={v => update(sel, { where: v })} placeholder="Company name" />
            <Field label="When" value={item.when} onChange={v => update(sel, { when: v })} placeholder="2024 — now" />
          </div>
          <Field label="Description" value={item.desc} onChange={v => update(sel, { desc: v })} type="textarea" rows={3} />
        </>
      )}
    </ListDetail>
  );
}

function AcademicsEditor({ data, onChange }) {
  const { sel, setSel, update, del, move } = useListEditor(data, onChange);
  const add = () => {
    const item = { name: 'New School', when: '', desc: '' };
    onChange([item, ...data]); setSel(0);
  };
  const item = data[sel];
  return (
    <ListDetail items={data} getLabel={e => e.name} sel={sel} onSel={setSel} onAdd={add} sectionTitle="Academics" emptyMsg="No academic entries yet">
      {item && (
        <>
          <div className="sec-head">
            <h2>{item.name}</h2>
            <div className="sec-head-actions">
              <MoveButtons onUp={() => move(sel, -1)} onDown={() => move(sel, 1)} />
              <button className="del-btn" onClick={() => del(sel, item.name)}>Delete</button>
            </div>
          </div>
          <Field label="School / Program" value={item.name} onChange={v => update(sel, { name: v })} />
          <Field label="When" value={item.when} onChange={v => update(sel, { when: v })} placeholder="2023 — 2025" />
          <Field label="Description" value={item.desc} onChange={v => update(sel, { desc: v })} type="textarea" rows={2} />
        </>
      )}
    </ListDetail>
  );
}

function LogsEditor({ data, onChange }) {
  const { sel, setSel, update, del } = useListEditor(data, onChange);
  const addGroup = () => { onChange([...data, { group: 'New group', books: [] }]); setSel(data.length); };
  const updBook = (gi, bi, changes) => {
    const books = [...data[gi].books]; books[bi] = { ...books[bi], ...changes };
    update(gi, { books });
  };
  const addBook = (gi) => update(gi, { books: [...data[gi].books, { title: '', author: '', note: '' }] });
  const delBook = (gi, bi) => update(gi, { books: data[gi].books.filter((_, j) => j !== bi) });
  const group = data[sel];
  return (
    <ListDetail items={data} getLabel={g => g.group} sel={sel} onSel={setSel} onAdd={addGroup} sectionTitle="Logs" emptyMsg="No log groups yet">
      {group && (
        <>
          <div className="sec-head">
            <h2>{group.group}</h2>
            <button className="del-btn" onClick={() => del(sel, group.group)}>Delete group</button>
          </div>
          <Field label="Group name" value={group.group} onChange={v => update(sel, { group: v })} />
          <div className="field">
            <label>Books</label>
            {group.books.length > 0 && (
              <div className="book-col-head">
                <span className="t">Title</span>
                <span className="a">Author</span>
                <span className="n">Note</span>
              </div>
            )}
            {group.books.length === 0 && (
              <div style={{ color: 'var(--ink-faint)', fontStyle: 'italic', fontSize: 13, marginBottom: 8 }}>
                No books yet — click + to add one
              </div>
            )}
            {group.books.map((book, bi) => (
              <div className="book-row" key={bi}>
                <input className="title" type="text" value={book.title} onChange={e => updBook(sel, bi, { title: e.target.value })} placeholder="Title" />
                <input className="author" type="text" value={book.author} onChange={e => updBook(sel, bi, { author: e.target.value })} placeholder="Author" />
                <input className="note" type="text" value={book.note || ''} onChange={e => updBook(sel, bi, { note: e.target.value })} placeholder="Note" />
                <button className="icon-btn" onClick={() => delBook(sel, bi)} title="Remove">×</button>
              </div>
            ))}
            <button className="text-btn" style={{ marginTop: 8 }} onClick={() => addBook(sel)}>+ Add book</button>
          </div>
        </>
      )}
    </ListDetail>
  );
}

function ContactEditor({ data, onChange }) {
  const update = (i, changes) => { const n = [...data]; n[i] = { ...n[i], ...changes }; onChange(n); };
  const remove = (i, label) => {
    if (!window.confirm(`Remove "${label}" contact?`)) return;
    onChange(data.filter((_, j) => j !== i));
  };
  const add = () => onChange([...data, { label: '', value: '', href: '#' }]);
  return (
    <div className="simple-pane" style={{ maxWidth: 680 }}>
      <div className="sec-head">
        <h2>Contact</h2>
        <button className="text-btn" onClick={add}>+ Add link</button>
      </div>
      <div className="contact-header">
        <span className="l">Label</span>
        <span className="v">Display value</span>
        <span className="h">Href</span>
      </div>
      {data.map((item, i) => (
        <div className="contact-row" key={i}>
          <input className="label" type="text" value={item.label} onChange={e => update(i, { label: e.target.value })} placeholder="email" />
          <input className="value" type="text" value={item.value} onChange={e => update(i, { value: e.target.value })} placeholder="hi@example.com" />
          <input className="href" type="text" value={item.href} onChange={e => update(i, { href: e.target.value })} placeholder="mailto:hi@example.com" />
          <button className="icon-btn" onClick={() => remove(i, item.label || item.value)} title="Remove">×</button>
        </div>
      ))}
    </div>
  );
}

/* ─── App shell ──────────────────────────────────────────────── */

function App() {
  const [content, setContent] = useState(null);
  const [info, setInfo] = useState({});
  const [dirty, setDirty] = useState(false);
  const [section, setSection] = useState('writings');
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);
  const [showCommitModal, setShowCommitModal] = useState(false);

  const contentRef = useRef(null);
  const dirtyRef = useRef(false);

  useEffect(() => { contentRef.current = content; }, [content]);
  useEffect(() => { dirtyRef.current = dirty; }, [dirty]);

  useEffect(() => {
    Promise.all([
      fetch('/api/content').then(r => r.json()),
      fetch('/api/info').then(r => r.json()),
    ]).then(([c, i]) => {
      if (c.error) setContent({ __error: c.error });
      else setContent(c);
      setInfo(i);
    }).catch(e => setContent({ __error: e.message }));
  }, []);

  // Cmd/Ctrl+S
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        if (dirtyRef.current) setShowCommitModal(true);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Warn on close with unsaved changes
  useEffect(() => {
    const onUnload = (e) => { if (dirtyRef.current) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', onUnload);
    return () => window.removeEventListener('beforeunload', onUnload);
  }, []);

  const update = (key, value) => {
    setContent(prev => ({ ...prev, [key]: value }));
    setDirty(true);
  };

  const doSave = async (commitMsg) => {
    setShowCommitModal(false);
    setSaving(true);
    const c = contentRef.current;
    try {
      const res = await fetch('/api/content', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...c, __msg: commitMsg }),
      });
      const data = await res.json();
      if (res.ok) {
        if (data.sha) setContent(prev => ({ ...prev, __sha: data.sha }));
        setDirty(false);
        showToast('Committed to GitHub ✓', 'ok');
      } else {
        showToast(data.error || 'Save failed', 'err');
      }
    } catch (e) { showToast('Network error', 'err'); }
    setSaving(false);
  };

  const showToast = (msg, type) => { setToast({ msg, type }); setTimeout(() => setToast(null), 3500); };

  if (!content) return <div className="loading">Loading…</div>;

  if (content.__error) return (
    <div className="loading" style={{ flexDirection: 'column', gap: 12 }}>
      <div style={{ fontSize: 16, color: 'var(--danger)' }}>⚠ {content.__error}</div>
      {!info.hasToken && (
        <div style={{ fontSize: 13, color: 'var(--ink-soft)', textAlign: 'center', maxWidth: 420, lineHeight: 1.6 }}>
          Add your GitHub token to <code style={{ background: 'var(--rule)', padding: '1px 5px', borderRadius: 3 }}>repocraft/.env</code>:<br/>
          <code style={{ background: 'var(--rule)', padding: '4px 8px', borderRadius: 3, display: 'inline-block', marginTop: 8 }}>GITHUB_TOKEN=ghp_your_token_here</code><br/>
          <span style={{ fontSize: 12, color: 'var(--ink-faint)', marginTop: 6, display: 'block' }}>
            Create one at github.com/settings/tokens — needs <strong>repo</strong> scope.
          </span>
          <button style={{ marginTop: 14, padding: '6px 14px', background: 'var(--accent)', color: '#fff', border: 'none', borderRadius: 4, cursor: 'pointer', fontFamily: 'var(--font)', fontSize: 13 }} onClick={() => window.location.reload()}>Reload</button>
        </div>
      )}
    </div>
  );

  const domain = content.SITE?.domain;
  const navItems = [
    ['site',      'Site',      null],
    ['writings',  'Writings',  content.ESSAYS?.length],
    ['projects',  'Projects',  content.PROJECTS?.length],
    ['work',      'Work',      null],
    ['academics', 'Academics', null],
    ['logs',      'Logs',      content.LOGS?.length],
    ['contact',   'Contact',   null],
  ];

  return (
    <div className="shell">
      <header className="topbar">
        <div className="brand">repocraft<span className="brand-dot">.</span></div>
        <div className="topbar-path">
          {info.repo && <a href={`https://github.com/${info.repo}`} target="_blank">{info.repo}</a>}
          {info.branch && <span style={{ marginLeft: 6, opacity: 0.5 }}>/ {info.branch}</span>}
        </div>
        {domain && (
          <a className="site-link" href={`https://${domain}`} target="_blank" rel="noreferrer">
            ↗ {domain}
          </a>
        )}
        <button
          className={`save-btn ${dirty ? 'dirty' : ''}`}
          onClick={() => dirty && setShowCommitModal(true)}
          disabled={!dirty || saving}
        >
          {saving ? 'Committing…' : dirty ? 'Commit to GitHub' : 'All saved ✓'}
        </button>
      </header>

      <div className="body">
        <nav className="sidebar">
          {navItems.map(([id, label, count]) => (
            <button key={id} className={`nav-item ${section === id ? 'active' : ''}`} onClick={() => setSection(id)}>
              {label}
              {count != null && <span className="badge">{count}</span>}
            </button>
          ))}
        </nav>
        <main className="main">
          {section === 'site'      && <SiteEditor      data={content.SITE}       onChange={v => update('SITE', v)} />}
          {section === 'writings'  && <WritingsEditor  data={content.ESSAYS}     onChange={v => update('ESSAYS', v)} domain={domain} />}
          {section === 'projects'  && <ProjectsEditor  data={content.PROJECTS}   onChange={v => update('PROJECTS', v)} />}
          {section === 'work'      && <WorkEditor      data={content.EXPERIENCE} onChange={v => update('EXPERIENCE', v)} />}
          {section === 'academics' && <AcademicsEditor data={content.ACADEMICS}  onChange={v => update('ACADEMICS', v)} />}
          {section === 'logs'      && <LogsEditor      data={content.LOGS}       onChange={v => update('LOGS', v)} />}
          {section === 'contact'   && <ContactEditor   data={content.CONTACT}    onChange={v => update('CONTACT', v)} />}
        </main>
      </div>

      {showCommitModal && (
        <CommitModal
          onCommit={doSave}
          onCancel={() => setShowCommitModal(false)}
          saving={saving}
        />
      )}

      {toast && <div className={`toast ${toast.type}`}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
